services:
  proxymini:
    image: ghcr.io/mishankov/proxymini:main
    environment:
      - PROXYMINI_PORT=1000
    ports:
      - 1000:1000
    volumes:
      - ./config/proxymini.conf.toml:/app/proxymini.conf.toml:ro
      - ./container-data/proxymini:/app/data:rw

  caddy:
    image: caddy:latest
    ports:
      - 80:80
      - 443:443
      - 2019:2019
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - ./container-data/caddy/data:/data
      - ./container-data/caddy/config:/config

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console port
    volumes:
      - ./container-data/minio/data:/data   # Mount host directory to /data
    environment:
      - MINIO_ROOT_USER=ROOTNAME
      - MINIO_ROOT_PASSWORD=CHANGEME123
    command: server /data --console-address ":9001"   # Launch command

  hostamat:
    build:
      context: ../platform
      dockerfile: Dockerfile.test
    env_file:
      - .env
    environment:
      - HOSTAMAT_PORT=1001
      - HOSTAMAT_LOG_LEVEL=debug
      - HOSTAMAT_LOG_TYPE=text
      - HOSTAMAT_DOMAIN=hostamat.localhost

      - HOSTAMAT_CADDY_URL=http://proxymini:1000/caddy/config
      - HOSTAMAT_CADDY_HOST=host.docker.internal:1001

      - HOSTAMAT_TIMEWEB_URL=http://proxymini:1000/timeweb

      - HOSTAMAT_S3_URL=minio:9000
      - HOSTAMAT_S3_LOGIN=ROOTNAME
      - HOSTAMAT_S3_PASSWORD=CHANGEME123
      - HOSTAMAT_S3_BUCKET=hostamat
    ports:
    - 1001:1001
    volumes:
      - ../platform:/app
