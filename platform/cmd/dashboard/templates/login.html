<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Login</title>

        <link
            href="https://cdn.jsdelivr.net/npm/daisyui@5"
            rel="stylesheet"
            type="text/css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="min-h-screen bg-base-200 flex items-center justify-center">
        <div class="card w-full max-w-md bg-base-100 shadow-xl">
            <div class="card-body">
                <div class="space-y-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Authentication Token</span>
                        </label>
                        <input
                            type="password"
                            id="token"
                            placeholder="Enter your auth token"
                            class="input input-bordered w-full"
                        />
                    </div>

                    <div class="form-control mt-6">
                        <button id="loginBtn" class="btn btn-primary w-full">
                            Login
                        </button>
                    </div>
                </div>

                <div id="errorMessage" class="alert alert-error mt-4 hidden">
                    <span id="errorText"></span>
                </div>
            </div>
        </div>

        <script>
            document
                .getElementById("loginBtn")
                .addEventListener("click", async () => {
                    const token = document.getElementById("token").value.trim();
                    const errorDiv = document.getElementById("errorMessage");
                    const errorText = document.getElementById("errorText");
                    const loginBtn = document.getElementById("loginBtn");

                    if (!token) {
                        errorText.textContent =
                            "Please enter your authentication token";
                        errorDiv.classList.remove("hidden");
                        return;
                    }

                    loginBtn.disabled = true;
                    loginBtn.textContent = "Logging in...";
                    errorDiv.classList.add("hidden");

                    try {
                        const response = await fetch("/login", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({ token: token }),
                        });

                        if (response.ok) {
                            window.location.href = "/dashboard";
                        } else {
                            errorText.textContent =
                                "Login failed. Please check your token.";
                            errorDiv.classList.remove("hidden");
                        }
                    } catch (error) {
                        errorText.textContent =
                            "Network error. Please try again.";
                        errorDiv.classList.remove("hidden");
                    } finally {
                        loginBtn.disabled = false;
                        loginBtn.textContent = "Login";
                    }
                });
        </script>
    </body>
</html>
