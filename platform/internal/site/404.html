<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Хостамат</title>
    <link rel="icon" href="/favicon.png" />
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        html, body {
            min-height: calc(100vh - 80px);
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-10deg, hsl(200, 70%, 5%), hsl(200, 70%, 7%));
            background-attachment: fixed;
            color: #e6f0ff;
        }

        .error-page {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        .error-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        .error-code {
            font-weight: bold;
            color: #e6f0ff;
        }

        .title {
            font-weight: bold;
            color: #e6f0ff;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            color: #e6f0ff;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
        }

        .button {
            appearance: none;
            width: fit-content;
            border-width: 1px;
            border-style: solid;
            border-radius: 5px;
            padding: 12px 20px;
            text-align: center;
            user-select: none;
            text-decoration: none;
            display: inline-block;
            color: hsl(200, 70%, 5%);
            background-color: hsl(200, 70%, 90%);
            border-color: hsl(200, 70%, 90%);
            transition: all 300ms cubic-bezier(0.23, 1, 0.32, 1);
        }

        .button:hover {
            box-shadow: 0.2px 0.2px 0.2px hsl(0deg 0% 0% / 0.67),
                0.2px 0.2px 0.2px -0.7px hsl(0deg 0% 0% / 0.59),
                0.5px 0.6px 0.6px -1.4px hsl(0deg 0% 0% / 0.5);
            transform: translateY(-1px);
        }

        .button:active {
            box-shadow: none;
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <main>
        <div class="error-page">
            <div class="error-content">
                <h1 class="error-code">404</h1>
                <h2 class="title">Страница не найдена</h2>
                <p class="message">
                    Запрашиваемая страница не существует или была удалена.<br />
                    Проверьте правильность адреса или вернитесь на главную страницу.
                </p>
                <div class="action-buttons">
                    <a href="/" class="button">Вернуться на главную</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
