<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - Хостамат</title>
    <link rel="icon" href="/favicon.png" />
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            text-align: center;
            background: linear-gradient(-10deg, hsl(200, 70%, 5%), hsl(200, 70%, 7%));
            background-attachment: fixed;
            color: #e6f0ff;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card {
            max-width: 600px;
            width: 100%;
            border-radius: 5px;
            border: 0.5px solid #f0b0b0;
            background: linear-gradient(-10deg, hsl(350, 70%, 5%), hsl(350, 70%, 7%));
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .icon-wrapper {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 5px;
            background: linear-gradient(-10deg, hsl(350, 70%, 10%), hsl(350, 70%, 15%));
            border: 0.5px solid #f0b0b0;
            color: #f0b0b0;
        }

        .error-code {
            font-size: 80px;
            font-weight: bold;
            margin: 0;
            line-height: 1;
            color: #f0b0b0;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            line-height: 1.5;
            color: #e6f0ff;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #b0c4d8;
            margin: 0;
        }

        .button {
            appearance: none;
            width: fit-content;
            border-width: 1px;
            border-style: solid;
            border-radius: 5px;
            padding: 12px 24px;
            text-align: center;
            user-select: none;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            color: #e6f0ff;
            background-color: #1a2d4d;
            border-color: #5a7dbd;
            transition: all 300ms cubic-bezier(0.23, 1, 0.32, 1);
            font-size: 16px;
            font-weight: 500;
        }

        .button:hover {
            box-shadow: 0.2px 0.2px 0.2px hsl(0deg 0% 0% / 0.67),
                0.2px 0.2px 0.2px -0.7px hsl(0deg 0% 0% / 0.59),
                0.5px 0.6px 0.6px -1.4px hsl(0deg 0% 0% / 0.5);
            transform: translateY(-1px);
        }

        .button:active {
            box-shadow: none;
            transform: translateY(1px);
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: hsl(200, 20%, 60%);
        }

        .footer a {
            color: hsl(200, 70%, 80%);
            text-decoration: none;
            transition: all 300ms;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrapper">
                <svg width="100" height="100" viewBox="-50 -50 100 100">
                    <line
                        x1="-30"
                        y1="-30"
                        x2="30"
                        y2="30"
                        stroke="currentColor"
                        stroke-width="7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <line
                        x1="30"
                        y1="-30"
                        x2="-30"
                        y2="30"
                        stroke="currentColor"
                        stroke-width="7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </div>
            <h1 class="error-code">404</h1>
            <h2 class="title">Страница не найдена</h2>
            <p class="message">
                Запрашиваемая страница не существует или была удалена.<br />
                Проверьте правильность адреса или вернитесь на главную страницу.
            </p>
            <a href="/" class="button">Вернуться на главную</a>
        </div>
        <div class="footer">
            <a href="https://hostamat.dev">Хостамат</a> — Хостинг статических сайтов
        </div>
    </div>
</body>
</html>
