<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Hostamat Icons - Preview</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				max-width: 1200px;
				margin: 0 auto;
				padding: 2rem;
				background: #f7f8fa;
				color: #172033;
				font-family:
					Inter,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					system-ui,
					sans-serif;
			}

			h1 {
				margin-bottom: 0.25rem;
				font-size: 1.5rem;
				font-weight: 650;
			}

			h2 {
				margin: 2rem 0 1rem;
				padding-bottom: 0.5rem;
				border-bottom: 1px solid #dfe4ea;
				font-size: 1.1rem;
				font-weight: 650;
			}

			.subtitle {
				margin-bottom: 2rem;
				color: #5d6878;
				font-size: 0.9rem;
			}

			.spec {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem 1.5rem;
				margin-bottom: 2rem;
				padding: 1rem 1.25rem;
				border: 1px solid #dfe4ea;
				border-radius: 8px;
				background: #fff;
				color: #465264;
				font-size: 0.85rem;
			}

			.spec span {
				white-space: nowrap;
			}

			.spec strong {
				color: #172033;
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
				gap: 1rem;
			}

			.grid.large {
				grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
			}

			.icon-card {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.65rem;
				min-height: 92px;
				padding: 1rem 0.5rem;
				border: 1px solid #dfe4ea;
				border-radius: 8px;
				background: #fff;
				color: #3457d5;
			}

			.icon-card svg {
				flex: none;
			}

			.label {
				color: #5d6878;
				font-size: 0.72rem;
				text-align: center;
				word-break: break-word;
			}

			.dark-section {
				margin-top: 2rem;
				padding: 2rem;
				border-radius: 12px;
				background: #111827;
			}

			.dark-section h2 {
				margin-top: 0;
				border-bottom-color: #293241;
				color: #fff;
			}

			.dark-section .icon-card {
				border-color: #293241;
				background: #1c2533;
				color: #f8fafc;
			}

			.dark-section .label {
				color: #a7b0bf;
			}

			.size-label {
				color: #7d8796;
				font-size: 0.75rem;
				font-weight: 600;
				letter-spacing: 0.05em;
				text-transform: uppercase;
			}
		</style>
	</head>
	<body>
		<h1>Hostamat Icons</h1>
		<p class="subtitle">13 icons · clean custom style · Generated 2026-05-02</p>

		<div class="spec">
			<span><strong>Grid:</strong> 24px</span>
			<span><strong>Stroke:</strong> 1.75px</span>
			<span><strong>Caps:</strong> round</span>
			<span><strong>Joins:</strong> round</span>
			<span><strong>Corner radius:</strong> 2px</span>
			<span><strong>Padding:</strong> 2px</span>
		</div>

		<h2>Native Size <span class="size-label">(24px)</span></h2>
		<div class="grid" id="native"></div>

		<h2>2x Size <span class="size-label">(48px)</span></h2>
		<div class="grid large" id="large"></div>

		<div class="dark-section">
			<h2>Dark Background <span class="size-label">(48px)</span></h2>
			<div class="grid large" id="dark"></div>
		</div>

		<script>
			const attrs =
				'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
			const icons = [
				['check', '<polyline points="5 12.5 9.5 17 19 7"/>'],
				[
					'copy',
					'<path d="M8.5 8V6.5A2 2 0 0 1 10.5 4.5H17A2 2 0 0 1 19 6.5v8A2 2 0 0 1 17 16.5h-1.5"/><rect x="5" y="8" width="10.5" height="12" rx="2" fill="var(--icon-surface, #fff)"/>'
				],
				[
					'download',
					'<path d="M3.75 13.75v3.75A2.75 2.75 0 0 0 6.5 20.25h11a2.75 2.75 0 0 0 2.75-2.75v-3.75"/><path d="M12 4.25v10.25"/><polyline points="6.75 9.5 12 14.75 17.25 9.5"/>'
				],
				[
					'edit',
					'<path d="M5.25 16.25 15.75 5.75a2.3 2.3 0 0 1 3.25 3.25L8.5 19.5l-5 1.25z"/><path d="M14.4 7.1 17.65 10.35"/><path d="M5.25 16.25 8.5 19.5"/>'
				],
				[
					'info',
					'<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01" stroke-width="2.5"/>'
				],
				[
					'moon',
					'<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5z" fill="currentColor"/>'
				],
				['plus', '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'],
				['spinner', '<circle cx="12" cy="12" r="8.25" stroke-dasharray="18 34"/>'],
				[
					'sun',
					'<circle cx="12" cy="12" r="4"/><path d="M12 2.75v2"/><path d="M12 19.25v2"/><path d="M4.25 4.25 5.75 5.75"/><path d="M18.25 18.25 19.75 19.75"/><path d="M2.75 12h2"/><path d="M19.25 12h2"/><path d="M4.25 19.75 5.75 18.25"/><path d="M18.25 5.75 19.75 4.25"/>'
				],
				[
					'trash',
					'<path d="M8.25 7V5.5a1.75 1.75 0 0 1 1.75-1.75h4A1.75 1.75 0 0 1 15.75 5.5V7"/><path d="M4 7h16"/><path d="M6.25 9.25 7.25 20.25h9.5l1-11"/><path d="M10 11.5v5.75"/><path d="M14 11.5v5.75"/>'
				],
				[
					'upload',
					'<path d="M3.75 13.75v3.75A2.75 2.75 0 0 0 6.5 20.25h11a2.75 2.75 0 0 0 2.75-2.75v-3.75"/><path d="M12 15.25V5"/><polyline points="6.75 10.25 12 5 17.25 10.25"/>'
				],
				[
					'warning',
					'<path d="M12 2.75 21.5 20H2.5z"/><path d="M12 8.5v5"/><path d="M12 17h.01" stroke-width="2.5"/>'
				],
				['x', '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>']
			];

			const render = (size) =>
				icons
					.map(
						([name, body]) =>
							`<div class="icon-card"><svg width="${size}" height="${size}" ${attrs}>${body}</svg><span class="label">${name}</span></div>`
					)
					.join('');

			document.querySelector('#native').innerHTML = render(24);
			document.querySelector('#large').innerHTML = render(48);
			document.querySelector('#dark').innerHTML = render(48);
		</script>
	</body>
</html>
