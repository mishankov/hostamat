version: "3"

vars:
  SSH_PROD: root@31.130.147.84

tasks:
  # Infra

  update-test-infra:
    dir: infra/test
    cmds:
      - docker compose pull

  test-infra:
    dir: infra/test
    cmds:
      - docker compose up proxymini caddy minio db -d --remove-orphans

  # Backend

  backend:
    deps: [test-infra]
    dir: infra/test
    cmds:
      - docker compose up hostamat

  test-backend:
    dir: platform
    cmds:
      - go test ./... -v -cover

  # Webapp

  webapp:
    dir: webapp
    cmds:
      - bun run --bun dev

  dash:
    dir: platform
    cmds:
      - TOKEN=secret_token DB_CONN=postgresql://hostamat:hostamat@localhost:5432/hostamat?sslmode=disable go run ./cmd/dashboard

  # Deploy

  deploy-prod:
    cmds:
      - ssh -t {{.SSH_PROD}} 'cd ~/hostamat/infra/prod; ./scripts/deploy-app.sh'

  pull-prod:
    cmds:
      - ssh -t {{.SSH_PROD}} 'cd ~/hostamat; git pull'
