version: "3"

vars:
  GREETING: Hello, World!

tasks:
  # Infra

  update-test-infra:
    dir: infra/test
    cmds:
      - docker compose pull

  test-infra:
    dir: infra/test
    cmds:
      - docker compose up proxymini caddy minio db -d --remove-orphans

  # Backend

  backend:
    deps: [test-infra]
    dir: infra/test
    cmds:
      - docker compose up hostamat

  test-backend:
    dir: platform
    cmds:
      - go test ./... -v -cover

  # Webapp

  webapp:
    dir: webapp
    cmds:
      - npm run dev

  dash:
    dir: platform
    cmds:
      - TOKEN=secret_token DB_CONN=postgresql://hostamat:hostamat@localhost:5432/hostamat?sslmode=disable go run ./cmd/dashboard
