version: "3"

tasks:
  # Infra

  update-test-infra:
    dir: infra/test
    cmds:
      - docker compose pull

  test-infra:
    dir: infra/test
    cmds:
      - docker compose up proxymini caddy minio db -d --remove-orphans

  # Backend

  backend:
    deps: [test-infra]
    dir: infra/test
    cmds:
      - docker compose down hostamat
      - docker compose up hostamat

  test-backend:
    dir: platform
    cmds:
      - go test ./... -v -cover

  # Webapp

  webapp:
    dir: webapp
    cmds:
      - bun run --bun dev

  # Dashboard
  dash:
    dir: infra/test
    cmds:
      - docker compose up dashboard --build

  # Deploy
  deploy:
    cmds:
      - atkins -f pipelines/deploy.yml --log execution.log
