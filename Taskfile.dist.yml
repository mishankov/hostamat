version: "3"

tasks:
  # Infra
  update-test-infra:
    dir: infra/test
    cmds:
      - docker compose pull

  test-infra:
    dir: infra/test
    cmds:
      - docker compose up proxymini caddy minio db -d --remove-orphans

  # Backend
  backend:
    deps: [test-infra]
    dir: infra/test
    cmds:
      - docker compose down hostamat
      - docker compose up hostamat

  test-backend:
    dir: platform
    cmds:
      - go test ./... -v -cover

  # Webapp
  webapp:
    dir: webapp
    cmds:
      - bun run --bun dev

  # Dashboard
  dash:
    dir: infra/test
    cmds:
      - docker compose up dashboard --build

  # Deploy
  deploy:
    cmds:
      - clear
      - atkins -f pipelines/deploy.yml --log execution.log

  # LLM helpers
  hrns:commit:
    desc: Commit and push using hrns
    cmds:
      - hrns exec -message="Create commit message for uncommited changes. Make commit with this message and push it to remote. Do not ask about commit message, just choose most fitting one" -provider="OpenCode Go" -model=kimi-k2.6 -agent=Builder
