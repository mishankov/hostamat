version: "3"

vars:
  SSH_PROD_APP: root@31.130.147.84
  SSH_PROD_SUPPORT: root@147.45.109.74
  CONTAINER_REGISTRY: hostamat-container-registry.registry.twcstorage.ru

tasks:
  # Infra

  update-test-infra:
    dir: infra/test
    cmds:
      - docker compose pull

  test-infra:
    dir: infra/test
    cmds:
      - docker compose up proxymini caddy minio db -d --remove-orphans

  # Backend

  backend:
    deps: [test-infra]
    dir: infra/test
    cmds:
      - docker compose up hostamat

  test-backend:
    dir: platform
    cmds:
      - go test ./... -v -cover

  # Webapp

  webapp:
    dir: webapp
    cmds:
      - bun run --bun dev

  dash:
    dir: platform
    cmds:
      - TOKEN=secret_token DB_CONN=postgresql://hostamat:hostamat@localhost:5432/hostamat?sslmode=disable go run ./cmd/dashboard

  # Docker

  push-backend:
    vars:
      TAG: hostamat/backend:latest
    dir: platform
    cmds:
      - docker build --tag {{.TAG}} --platform linux/amd64 .
      - docker tag {{.TAG}} {{.CONTAINER_REGISTRY}}/{{.TAG}}
      - docker push {{.CONTAINER_REGISTRY}}/{{.TAG}}

  push-webapp:
    vars:
      TAG: hostamat/webapp:latest
    dir: webapp
    cmds:
      - docker build --tag {{.TAG}} --platform linux/amd64 .
      - docker tag {{.TAG}} {{.CONTAINER_REGISTRY}}/{{.TAG}}
      - docker push {{.CONTAINER_REGISTRY}}/{{.TAG}}

  push-dashboard:
    vars:
      TAG: hostamat/dashboard:latest
    dir: platform
    cmds:
      - docker build --tag {{.TAG}} --platform linux/amd64 --file Dockerfile.dashboard .
      - docker tag {{.TAG}} {{.CONTAINER_REGISTRY}}/{{.TAG}}
      - docker push {{.CONTAINER_REGISTRY}}/{{.TAG}}

  # Deploy

  deploy-prod-app:
    deps: ["push-backend", "push-webapp"]
    cmds:
      - cat ./infra/prod/scripts/deploy-app.sh | ssh -t {{.SSH_PROD_APP}}

  deploy-prod-support:
    deps: ["push-dashboard"]
    cmds:
      - cat ./infra/prod/scripts/deploy-support.sh | ssh -t {{.SSH_PROD_SUPPORT}}

  deploy-prod:
    deps: ["deploy-prod-support", "deploy-prod-app"]
    cmds:
      - ssh -t {{.SSH_PROD_APP}} 'cd ./hostamat/infra/prod; docker compose logs hostamat -f'
