name: Deploy

vars:
  SSH_PROD: -i ~/.ssh/hostamat_admin root@5.129.199.174
  CONTAINER_REGISTRY: hostamat-container-registry.registry.twcstorage.ru
  TAG: $(date +%Y%m%d-%H%M%S)

jobs:
  default:
    desc: Run all tasks
    depends_on: [push-backend, push-webapp, push-dashboard, push-caddy]
    steps:
      - run: cat ./infra/prod/scripts/deploy-stack.sh | ssh -t ${{SSH_PROD}}

  push-backend:
    vars:
      IMAGE: hostamat/backend
    dir: platform
    detach: true
    steps:
      - run: docker build --tag ${{IMAGE}}:${{TAG}} --platform linux/amd64 .
      - run: docker tag ${{IMAGE}}:${{TAG}} ${{CONTAINER_REGISTRY}}/${{IMAGE}}:${{TAG}}
      - run: docker tag ${{IMAGE}}:${{TAG}} ${{CONTAINER_REGISTRY}}/${{IMAGE}}:latest
      - run: docker push ${{CONTAINER_REGISTRY}}/${{IMAGE}}:${{TAG}}
      - run: docker push ${{CONTAINER_REGISTRY}}/${{IMAGE}}:latest

  push-webapp:
    vars:
      IMAGE: hostamat/webapp
    dir: webapp
    detach: true
    steps:
      - run: docker build --tag ${{IMAGE}}:${{TAG}} --platform linux/amd64 .
      - run: docker tag ${{IMAGE}}:${{TAG}} ${{CONTAINER_REGISTRY}}/${{IMAGE}}:${{TAG}}
      - run: docker tag ${{IMAGE}}:${{TAG}} ${{CONTAINER_REGISTRY}}/${{IMAGE}}:latest
      - run: docker push ${{CONTAINER_REGISTRY}}/${{IMAGE}}:${{TAG}}
      - run: docker push ${{CONTAINER_REGISTRY}}/${{IMAGE}}:latest

  push-dashboard:
    vars:
      IMAGE: hostamat/dashboard
    dir: platform
    detach: true
    steps:
      - run: docker build --tag ${{IMAGE}}:${{TAG}} --platform linux/amd64 --file Dockerfile.dashboard .
      - run: docker tag ${{IMAGE}}:${{TAG}} ${{CONTAINER_REGISTRY}}/${{IMAGE}}:${{TAG}}
      - run: docker tag ${{IMAGE}}:${{TAG}} ${{CONTAINER_REGISTRY}}/${{IMAGE}}:latest
      - run: docker push ${{CONTAINER_REGISTRY}}/${{IMAGE}}:${{TAG}}
      - run: docker push ${{CONTAINER_REGISTRY}}/${{IMAGE}}:latest

  push-caddy:
    vars:
      IMAGE: hostamat/caddy
    dir: infra/prod
    detach: true
    steps:
      - run: docker build --tag ${{IMAGE}}:${{TAG}} --platform linux/amd64 --file Dockerfile.caddy .
      - run: docker tag ${{IMAGE}}:${{TAG}} ${{CONTAINER_REGISTRY}}/${{IMAGE}}:${{TAG}}
      - run: docker tag ${{IMAGE}}:${{TAG}} ${{CONTAINER_REGISTRY}}/${{IMAGE}}:latest
      - run: docker push ${{CONTAINER_REGISTRY}}/${{IMAGE}}:${{TAG}}
      - run: docker push ${{CONTAINER_REGISTRY}}/${{IMAGE}}:latest
