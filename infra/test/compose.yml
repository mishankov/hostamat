services:
  proxymini:
    image: ghcr.io/mishankov/proxymini:main
    environment:
      - PROXYMINI_PORT=1000
    ports:
      - 1000:1000
    volumes:
      - ./config/proxymini.conf.toml:/app/proxymini.conf.toml:ro
      - ./container-data/proxymini:/app/data:rw

  caddy:
    image: caddy:latest
    ports:
      - 80:80
      - 443:443
      - 2019:2019
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - ./container-data/caddy/data:/data
      - ./container-data/caddy/config:/config
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --resume

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    volumes:
      - ./container-data/minio/data:/data # Mount host directory to /data
    environment:
      - MINIO_ROOT_USER=ROOTNAME
      - MINIO_ROOT_PASSWORD=CHANGEME123
    command: server /data --console-address ":9001" # Launch command

  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_DB=hostamat
      - POSTGRES_USER=hostamat
      - POSTGRES_PASSWORD=hostamat
    expose:
      - 5432
    ports:
      - "5432:5432"

  dashboard:
    build:
      context: ../../platform
      dockerfile: Dockerfile.dashboard
    env_file:
      - .env
    ports:
      - 1002:4444

  hostamat:
    build:
      context: ../../platform
      dockerfile: Dockerfile.test
    env_file:
      - .env
    environment:
      - HOSTAMAT_PORT=1001
      - HOSTAMAT_LOG_LEVEL=debug
      - HOSTAMAT_LOG_TYPE=text
      - HOSTAMAT_DOMAIN=hostamat.localhost
      - HOSTAMAT_FILESERVER_HOST=host.docker.internal:1001
      - HOSTAMAT_FILESERVER_PATH=/files/serve

      - HOSTAMAT_CADDY_URL=http://proxymini:1000/caddy
      - HOSTAMAT_CADDY_SHORTHAND_ID=hostamat_proxy

      - HOSTAMAT_POSTGRES_HOST=db
      - HOSTAMAT_POSTGRES_PORT=5432
      - HOSTAMAT_POSTGRES_DB=hostamat
      - HOSTAMAT_POSTGRES_USER=hostamat
      - HOSTAMAT_POSTGRES_PASSWORD=hostamat

      - HOSTAMAT_S3_URL=minio:9000
      - HOSTAMAT_S3_LOGIN=ROOTNAME
      - HOSTAMAT_S3_PASSWORD=CHANGEME123
      - HOSTAMAT_S3_BUCKET=hostamat
    ports:
      - 1001:1001
    volumes:
      - ../../platform:/app
