services:
  caddy:
    image: caddy:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.kind == webserver
    ports:
      - 80:80
      - 443:443
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-conf:/config
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --resume

  portainer_agent:
    image: portainer/agent:2.33.3
    deploy:
      mode: global
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host

configs:
  caddyfile:
    external: true

volumes:
  caddy-data:
    external: true
  caddy-conf:
    external: true
