services:
  # webserver
  caddy:
    image: caddy:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.kind == webserver
    ports:
      - 80:80
      - 443:443
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-conf:/config
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --resume

  # app
  hostamat:
    image: hostamat-container-registry.registry.twcstorage.ru/hostamat/backend:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.kind == app
    env_file:
      - .env

  webapp:
    image: hostamat-container-registry.registry.twcstorage.ru/hostamat/webapp:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.kind == app
    env_file:
      - .env

  # support
  portainer:
    image: portainer/portainer-ce:lts
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.kind == support
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - 8080:9443
      - 8000:8000

  # global
  dozzle:
    image: amir20/dozzle:latest
    environment:
      - DOZZLE_MODE=swarm
    configs:
      - source: dozzle_users
        target: /data/users.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8081:8080
    networks:
      - dozzle
    deploy:
      mode: global

configs:
  caddyfile:
    external: true
  dozzle_users:
    external: true

volumes:
  caddy-data:
    external: true
  caddy-conf:
    external: true
  portainer_data:
    external: true

networks:
  dozzle:
    driver: overlay
