services:
  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - 80:80
      - 443:443
    expose:
      - 2019
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - ./container-data/caddy/data:/data
      - ./container-data/caddy/config:/config
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --resume
    restart: unless-stopped

  hostamat:
    image: hostamat-container-registry.registry.twcstorage.ru/hostamat/backend:latest
    container_name: hostamat
    ports:
      - ${HOSTAMAT_PORT}:1001
    env_file:
      - .env
    depends_on:
      - caddy
    restart: unless-stopped

  webapp:
    image: hostamat-container-registry.registry.twcstorage.ru/hostamat/webapp:latest
    container_name: landing
    expose:
      - 3000
    env_file:
      - .env
    restart: unless-stopped

  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle-agent
    command: agent
    environment:
      - DOZZLE_HOSTNAME=hostamat
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 7007:7007
    restart: unless-stopped

  portainer_agent:
    image: portainer/agent:2.33.3
    container_name: portainer_agent
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    restart: unless-stopped
