services:
  caddy:
    image: caddy:latest
    ports:
      - 80:80
      - 443:443
      - 2019:2019
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - ./container-data/caddy/data:/data
      - ./container-data/caddy/config:/config
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --resume

  hostamat:
    build:
      context: ../../platform
      dockerfile: Dockerfile
      network: host
    env_file:
      - .env

  landing:
    build:
      context: ../../webapp
      dockerfile: Dockerfile
      network: host
    env_file:
      - .env

  # TODO: use agent on host and viwer on separate host
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/dozzle:/data
    ports:
      - 8080:8080
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_ENABLE_SHELL=true
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_AUTH_TTL=10000h