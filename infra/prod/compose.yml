services:
  caddy:
    image: caddy:latest
    ports:
      - 80:80
      - 443:443
      - 2019:2019
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - ./container-data/caddy/data:/data
      - ./container-data/caddy/config:/config

  hostamat:
    build:
      context: ../../platform
      dockerfile: Dockerfile
      network: host
    env_file:
      - .env

  landing:
    build:
      context: ../../webapp
      dockerfile: Dockerfile
      network: host
    env_file:
      - .env
