global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: hostamat
    static_configs:
      - targets: ["hostamat:1001"]

  - job_name: db-linux
    static_configs:
      - targets: ["192.168.0.7:9100"]

  - job_name: db-postgres
    static_configs:
      - targets: ["192.168.0.7:9308"]

  - job_name: node-moscow-1
    static_configs:
      - targets: ["192.168.0.4:9100"]

  - job_name: node-moscow-2
    static_configs:
      - targets: ["192.168.0.5:9100"]

  - job_name: node-moscow-3
    static_configs:
      - targets: ["192.168.0.6:9100"]
