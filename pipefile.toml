[vars]
cr = "hostamat-container-registry.registry.twcstorage.ru"

[[steps]]
id = "push-backend"
name = "Push backend"
dir = "./platform"
vars = { tag = "hostamat/backend:latest" }
cmds = [
    "docker build --tag @{tag} --platform linux/amd64 .",
    "docker tag @{tag} @{cr}/@{tag}",
    "docker push @{cr}/@{tag}"
]


[[steps]]
id = "push-webapp"
name = "Push webapp"
dir = "./webapp"
vars = { tag = "hostamat/webapp:latest" }
cmds = [
    "docker build --tag @{tag} --platform linux/amd64 .",
    "docker tag @{tag} @{cr}/@{tag}",
    "docker push @{cr}/@{tag}"
]


[[steps]]
id = "push-dashboard"
name = "Push dashboard"
dir = "./platform"
vars = { tag = "hostamat/dashboard:latest" }
cmds = [
    "docker build --tag @{tag} --platform linux/amd64 .",
    "docker tag @{tag} @{cr}/@{tag}",
    "docker push @{cr}/@{tag}"
]


[[steps]]
id = "push-caddy"
name = "Push caddy"
dir = "./infra/prod"
vars = { tag = "hostamat/caddy:latest" }
cmds = [
    "docker build --tag @{tag} --platform linux/amd64 --file Dockerfile.caddy .",
    "docker tag @{tag} @{cr}/@{tag}",
    "docker push @{cr}/@{tag}"
]


