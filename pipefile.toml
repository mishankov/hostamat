[[steps]]
id = "push-backend"
name = "Push backend"
cmds = [
    "docker build --tag hostamat/backend:latest --platform linux/amd64 .",
    "docker tag hostamat/backend:latest hostamat-container-registry.registry.twcstorage.ru/hostamat/backend:latest",
    "docker push hostamat-container-registry.registry.twcstorage.ru/hostamat/backend:latest"
]


